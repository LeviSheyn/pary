/* Тёмно-зелёный фон, светлые «бумажные» блоки; один шрифт; радиусы: --r для блоков и 99px для кнопок; шаг отступов 8px */
:root{--bg:#0b2620;--on:#eef4f0;--onm:#9dbbb1;--rail:#24493f;--paper:#f3efe5;--ink:#17231e;--ink2:#5f6b65;--rule:#dcd5c4;--acc:#4fd69c;--exam:#e07f0a;--calc:#1f6f5c;--lin:#2b8a99;--disc:#7a8a2e;--eng:#8c7a4e;--gen:#6d8578;--dep:#8a958f;--f:Plex,system-ui,sans-serif;--m:Plex,system-ui,sans-serif;--r:8px;--h:42px;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--on);font:15px/1.4 var(--f);font-variant-numeric:tabular-nums;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 104px;margin:0 auto;max-width:520px}
html,*{-webkit-tap-highlight-color:rgba(0,0,0,0)!important}
button,nav,.hero,.next,.ev,.rw,.cell{-webkit-user-select:none;user-select:none}
button:focus:not(:focus-visible){outline:none}
.ver{display:block;text-align:center;color:var(--rail);font-size:11px;margin-top:32px}
button{font:inherit;color:inherit;touch-action:manipulation}
button:active{transform:scale(.98);transition:transform .1s}
nav button:active{transform:none}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:24px}
h1{font:500 26px/1.1 var(--f);margin:0}
.top small,.clock{color:var(--onm);font-variant-numeric:tabular-nums}
.clock{font:400 16px var(--m)}
.tt,.rm,.lb,.ln span:first-child,.tl .hr,.mx .hd,.tc span,.wk b{font-family:var(--m)!important}
.lb{display:block;font:500 11px var(--m);letter-spacing:.08em;text-transform:uppercase}
.dot{display:inline-block;width:8px;height:8px;border-radius:1px;background:var(--c);margin-right:8px;vertical-align:2px;flex:none}
.mk{font:500 11px var(--m);letter-spacing:.08em;text-transform:uppercase;margin-left:8px;color:var(--ink2);text-decoration:none!important;display:inline-block}
.mk.ex{color:var(--exam)}
.hero .mk{color:var(--onm)}.hero .mk.ex{color:var(--exam)}
.off .nm,.off .tt{text-decoration:line-through}
.heb{direction:rtl;font-size:13px}
/* Сейчас */
.hero{display:block;width:100%;text-align:left;background:none;border:0;padding:0;cursor:pointer}
.hero .lb{color:var(--onm)}
.hero b{display:block;font:300 64px/1 var(--m);letter-spacing:-.02em;margin:8px 0 16px}
.hero .nm{font:500 22px/1.25 var(--f)}
.pg{height:3px;background:var(--rail);margin-top:12px;overflow:hidden}
.pg i{display:block;height:100%;background:var(--acc);transform-origin:left;will-change:transform}
.pgl{display:flex;justify-content:space-between;font:400 11px var(--m);color:var(--onm);margin-top:4px}
.dy{position:relative;height:28px;margin:24px 0 4px}
.dy i{position:absolute;top:10px;height:8px;background:var(--c)}
.dy i.off{background:none;border:1px dashed var(--onm);opacity:.6}
.dy b{position:absolute;top:2px;bottom:2px;width:2px;background:var(--on);transform:translateX(-1px)}
.dyl{display:flex;justify-content:space-between;font:400 11px var(--m);color:var(--onm)}
.hero .mt{color:var(--onm);margin-top:4px}
.hero .heb{color:var(--onm);text-align:left;margin-top:4px}
.hero.exam b{color:var(--exam)}
.ln{display:flex;gap:16px;color:var(--onm);font-size:14px;padding:8px 0;border-top:1px solid var(--rail)}
.ln span:first-child{width:48px;flex:none;font-variant-numeric:tabular-nums}
.nfs{margin-top:24px}
.nfh{display:flex;justify-content:space-between;align-items:baseline;color:var(--onm);margin-bottom:8px}
.nfh button{background:none;border:0;color:var(--acc);font:400 12px var(--m);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding:4px 0}
.stk{display:grid;padding-bottom:20px}
.stk>.nf{grid-area:1/1}
.nfs:not(.open) .stk.many{cursor:pointer}
.stk>.nf:nth-child(2){transform:translateY(10px) scale(.95);z-index:-1;background:color-mix(in srgb,var(--paper) 80%,var(--bg))}

.stk>.nf:not(:first-child)>*{visibility:hidden}
.nfs.open .stk{gap:8px;padding-bottom:0}
.nfs.open .stk>.nf{grid-area:auto;transform:none;opacity:1;z-index:auto;background:var(--paper)}
.nfs.open .stk>.nf>*{visibility:visible}
.nf{position:relative;display:flex;gap:12px;align-items:flex-start;background:var(--paper);color:var(--ink);border-radius:14px;padding:12px 14px;box-shadow:0 6px 20px rgba(0,0,0,.35);transform-origin:top center}
.nf>i{flex:none;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font:500 13px var(--m);font-style:normal;background:var(--rule);color:var(--ink2)}
.nf.ex>i{background:var(--exam);color:#fff}
.nf>div{flex:1;min-width:0}
.nf .lb{color:var(--ink2);display:flex;justify-content:space-between;gap:8px}

.nf .t{font-weight:500;margin-top:2px}
.nf .s{color:var(--ink2);font-size:13px}
.nf .act{flex:none;align-self:center;background:none;border:0;color:var(--calc);font:500 12px var(--m);letter-spacing:.06em;text-transform:uppercase;padding:8px 0 8px 8px;cursor:pointer}
.nf.ex em{color:var(--exam)}
.next{display:grid;grid-template-columns:56px 1fr;gap:4px 16px;width:100%;text-align:left;background:var(--paper);color:var(--ink);border:0;border-radius:var(--r);padding:16px;margin-top:24px;cursor:pointer}
.next>.lb{grid-column:1/-1;color:var(--ink2)}
.next .tt{font:400 20px/1.2 var(--m)}
.next .tt small{display:block;font-size:13px;color:var(--ink2)}
.next .nm{font-weight:500;font-size:17px}
.next .mt{color:var(--ink2);font-size:13px;margin-top:2px}
.empty{color:var(--onm);padding:24px 0}
/* Сегодня: шкала */
.tl{position:relative;margin-top:8px}
.tl .hr{position:absolute;left:0;right:0;border-top:1px solid var(--rail);font-size:12px;color:var(--onm);font-variant-numeric:tabular-nums}
.tl .hr span{position:relative;top:-9px;background:var(--bg);padding-right:8px}
.ev,.cell{display:flex;flex-direction:column;justify-content:flex-start}
.ev{position:absolute;left:48px;right:0;border:0;border-radius:var(--r);background:var(--paper);color:var(--ink);text-align:left;padding:8px 16px;cursor:pointer;overflow:hidden}
.ev .tt{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums}
.ev .nm{font-weight:500;margin-top:2px}
.ev .mt{font-size:13px;color:var(--ink2)}
.ev.past{opacity:.5}
.ev.cur{box-shadow:inset 0 0 0 2px var(--acc)}
.ev.off{background:color-mix(in srgb,var(--paper) 55%,var(--bg))}
.ev.exam{box-shadow:inset 0 0 0 2px var(--exam)}
.ev.dep,.cell.dep{background:none;border:1px dashed var(--rail);color:var(--onm);cursor:default}
.ev.dep .tt,.ev.dep .mt{color:var(--onm)}
.now{position:absolute;left:40px;right:0;height:2px;background:var(--acc);z-index:1}
.now::before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
/* Неделя */
.wk{display:flex;align-items:center;gap:8px;margin-bottom:24px}
.wk div{flex:1;text-align:center}
.wk b{display:block;font-size:16px}
.wk small{color:var(--onm)}
.wk button{width:40px;height:40px;flex:none;border:1px solid var(--rail);border-radius:99px;background:none;font-size:18px;cursor:pointer}
.wk button:disabled{opacity:.3;cursor:default}
.wk .vw{width:auto;padding:0 16px;font-size:14px}
.day{margin-bottom:24px}
.dh{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.dh b{font-size:17px}
.dh span{color:var(--onm)}
.dh i{margin-left:auto;font-style:normal;color:var(--onm)}
.today .dh b,.today .dh span{color:var(--acc)}
.sheet{background:var(--paper);color:var(--ink);border-radius:var(--r);overflow:hidden}
.rw{display:grid;grid-template-columns:48px 1fr;gap:16px;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--rule);padding:12px 16px;cursor:pointer}
.rw:first-child{border-top:0}
.rw .tt{font-weight:500;font-variant-numeric:tabular-nums}
.rw .tt small{display:block;color:var(--ink2);font-weight:400}
.rw .nm{font-weight:500}
.rw .mt{color:var(--ink2);font-size:13px}
.rw.dep{color:var(--ink2);cursor:default}
.rw.dep .nm{font-weight:400}
.rw.off{color:var(--ink2)}
.rw.exam .tt{color:var(--exam)}
.free{color:var(--onm)}
/* Неделя: таблица */
.mx{display:grid;grid-template-columns:28px repeat(5,minmax(0,1fr));gap:0 4px}
.mx .hd{text-align:center;font-size:12px;color:var(--onm);padding-bottom:8px;line-height:1.2}
.mx .hd b{display:block;font-size:14px;color:var(--on)}
.mx .hd.tdy b,.mx .hd.tdy{color:var(--acc)}
.col,.tc{position:relative;height:calc(12*var(--h))}
.col{background:repeating-linear-gradient(to bottom,var(--rail) 0 1px,transparent 1px var(--h))}
.tc span{position:absolute;right:4px;font-size:11px;color:var(--onm);transform:translateY(-50%);font-variant-numeric:tabular-nums}
.cell{position:absolute;border:0;border-radius:8px;padding:4px;font-size:11px;line-height:1.2;background:var(--paper);color:var(--ink);text-align:left;overflow:hidden;overflow-wrap:anywhere;cursor:pointer}
.cell .dot{width:6px;height:6px;margin-right:4px;vertical-align:1px}
.cell small{display:block;color:var(--ink2);font-size:10px}
.cell.off{background:color-mix(in srgb,var(--paper) 45%,var(--bg));text-decoration:line-through}
.cell.exam{box-shadow:inset 0 0 0 2px var(--exam)}
/* Окно пары */
.md{position:fixed;inset:0;z-index:5;background:rgba(2,14,11,.78);display:flex;align-items:flex-end;justify-content:center;padding:16px 16px calc(88px + env(safe-area-inset-bottom,0px))}
.sh{width:100%;max-width:488px;background:var(--paper);color:var(--ink);border-radius:var(--r);padding:24px}
.sh small{color:var(--ink2)}
.sh .nm{font:500 22px/1.25 var(--f);margin:8px 0 4px}
.sh .mt{color:var(--ink2)}
.sh .heb{color:var(--ink2);margin-top:4px}
.bt{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.bt button{border:1px solid var(--rule);background:none;border-radius:99px;padding:8px 16px;cursor:pointer}
.bt .on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bt .cl{margin-left:auto;border:0;color:var(--ink2)}
/* Фон: тонкие орбиты-эллипсы */
/* Фон: эллипсы — отдельные слои, двигаются только transform (видеокарта, без перерисовки) */
.bgx{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden;contain:strict}
.bgx i{position:absolute;border:1px solid var(--acc);border-radius:50%;will-change:transform;animation:orb 16s ease-in-out infinite alternate}
.bgx i:nth-child(1){width:150vw;height:75vw;left:-55vw;top:-4vw;opacity:.1}
.bgx i:nth-child(2){width:120vw;height:60vw;left:30vw;top:48vh;opacity:.08;animation-duration:21s;animation-direction:alternate-reverse}
.bgx i:nth-child(3){width:100vw;height:45vw;left:-20vw;top:84vh;opacity:.07;animation-duration:13s}
@keyframes orb{to{transform:rotate(24deg) scale(1.08,.94)}}
@media(prefers-reduced-motion:reduce){.bgx i{animation:none}}
/* Нижняя панель */
main{position:relative;overflow-x:clip;margin:0 -16px;padding:0 16px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:8px;padding:8px 16px calc(8px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--rail)}
nav button{position:relative;z-index:1;flex:1;max-width:160px;border:0;border-radius:99px;padding:12px;font-weight:500;font-size:14px;background:none;color:var(--onm);cursor:pointer;transition:color .3s}
nav button.on{color:var(--bg)}
.pill{will-change:transform;position:absolute;left:0;top:8px;height:calc(100% - 16px - env(safe-area-inset-bottom,0px));border-radius:99px;background:var(--acc);transform-origin:left center}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
</style>

<script>
const R='Английский (базовый)',H=`אנגלית בסיסי`,EL=`גב' אלנבוגן רות`,DM='Дискретная математика',DH_=`מתמטיקה בדידה`,MA='Матанализ 1',MH=`חשבון אינפיניטסימלי 1`,LA='Линейная алгебра 1',LH=`אלגברה לינארית 1`,RA=`פרופ' רינות אסף`,OS=`ד"ר שלום אור`,DP=['dep','Часы кафедры',`שעות מחלקה`,'88009-01','',''];
// [начало, конец, тип, рус, иврит, код, аудитория, преподаватель]
const W=[
	[['08:00','12:00','eng',R,H,'41004-03','507 · 209',EL],

	['10:00','12:00','disc',DM,DH_,'88195-01','507 · 102',RA],

	[],
	[['10:00','12:00','calc',MA,MH,'88132-01','507 · 102',''],
	['12:00','14:00',...DP],
	['14:00','16:00','lin',LA,LH,'88112-01','905 · 61',OS]],
	[],[]];
for(const D of W)for(const l of D)if(l[2]!='dep'){const m=l[1].slice(0,2)*60+ +l[1].slice(3)-30;l[1]=`${String(m/60|0).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`}
const DN=['Воскресенье','Понедельник','Вторник','Среда','Четверг','Пятница','Суббота'],DHe=['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
const mi=s=>s.slice(0,2)*60+ +s.slice(3),$=id=>document.getElementById(id),p=n=>String(n).padStart(2,'0');
const ymd=d=>`${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}`,add=(d,n)=>{const x=new Date(d);x.setDate(x.getDate()+n);x.setHours(0,0,0,0);return x};
const dm=d=>d.toLocaleDateString('ru-RU',{day:'numeric',month:'short'}).replace('.','');
const at=(d,hm)=>{const x=new Date(d);x.setHours(hm.slice(0,2),hm.slice(3),0,0);return x};
// Пометки пар: ключ «дата|начало|код» -> 'off' (не состоится) или 'exam'; хранятся на телефоне
let MK={};try{MK=JSON.parse(localStorage.mark||'{}');for(const k of JSON.parse(localStorage.off||'[]'))MK[k]='off';localStorage.mark=JSON.stringify(MK);localStorage.removeItem('off')}catch(e){}
const kOf=(d,l)=>`${ymd(d)}|${l[0]}|${l[5]}`;
const lessons=d=>W[d.getDay()].map(l=>{const k=kOf(d,l);return{l,k,d,off:MK[k]=='off',exam:MK[k]=='exam',dep:l[2]=='dep'}});
const real=d=>lessons(d).filter(x=>!x.dep);
const SH={'139240-01':'Идиш','33175-01':'Формал.','183047-01':'Психол.'};
const short=l=>({calc:'Матан',lin:l[5]=='88112-03'?'Линал, тиргуль':'Линал',disc:'Дискр.',eng:'Англ.',dep:'Кафедра'})[l[2]]||SH[l[5]];
const dot=l=>`<i class="dot" style="--c:var(--${l[2]})"></i>`;
const chips=x=>(x.exam?'<span class="mk ex">экзамен</span>':'')+(x.off?'<span class="mk">отменена</span>':'');
const cls=x=>(x.off?' off':'')+(x.exam?' exam':'')+(x.dep?' dep':'');
const whenD=(d,n)=>{const i=Math.round((add(d,0)-add(n,0))/864e5);return i==0?'сегодня':i==1?'завтра':`${DN[d.getDay()].toLowerCase()}, ${dm(d)}`};
function fmt(ms){
	let s=Math.max(0,Math.floor(ms/1e3));const d=Math.floor(s/86400);s%=86400;
	const h=Math.floor(s/3600),m=Math.floor(s%3600/60);
	return d?`${d} д ${h} ч`:h?`${h}:${p(m)}:${p(s%60)}`:`${p(m)}:${p(s%60)}`;
}
// Ближайшие пары, которые состоятся (после момента n), и отменённые до первой из них
function upcoming(n,c){
	const t=n.getHours()*60+n.getMinutes(),r=[],skip=[];
	for(let i=0;i<120&&r.length<c;i++){
		const d=add(n,i);
		for(const x of real(d))if((i||mi(x.l[0])>t)&&r.length<c){if(x.off){if(!r.length)skip.push(x)}else r.push({...x,at:at(d,x.l[0])})}
	}
	return{r,skip};
}
function state(n){
	const t=n.getHours()*60+n.getMinutes(),L=real(n),on=L.filter(x=>!x.off),last=on.at(-1);
	const cur=L.find(x=>mi(x.l[0])<=t&&t<mi(x.l[1])),u=upcoming(n,2);
	let ex;
	for(const k of Object.keys(MK).filter(k=>MK[k]=='exam').sort()){
		const[dt,hm,code]=k.split('|'),d0=new Date(dt+'T00:00'),l=W[d0.getDay()].find(l=>l[0]==hm&&l[5]==code),a=at(d0,hm);
		if(l&&a>n){ex={l,at:a};break}
	}
	return{d:n.getDay(),t,L,cur,u,ex,end:last&&t<mi(last.l[1])?at(n,last.l[1]):null,last};
}
const mt=x=>[x.l[6]&&`<span class="rm">${x.l[6]}</span>`,x.l[7]].filter(Boolean).join(' · ');
// Вкладка «Сейчас»: крупный отсчёт, под ним пара; ниже следующая на бумаге и строки-сноски
let T1,PG,NFO=0;
function main(s,n){
	const c=s.cur&&!s.cur.off?{...s.cur,at:at(n,s.cur.l[0])}:null,[a,b]=s.u.r;
	let h='',sub,then,lab;PG=null;
	if(c){sub=c;then=a;lab='До конца пары';T1=at(n,c.l[1]);PG=[c.at,T1]}
	else if(a){
		sub=a;then=b;T1=a.at;
		const prev=s.L.filter(x=>!x.off&&mi(x.l[1])<=s.t).at(-1);
		lab=ymd(a.d)!=ymd(n)?`${s.L.some(x=>!x.off)?'Сегодня пар больше нет · ':s.L.length?'Сегодня всё отменили · ':''}до следующей · ${whenD(a.d,n)}`:prev&&mi(a.l[0])-mi(prev.l[1])<=30?'Перемена · до начала пары':'До начала пары';
	}
	if(s.cur?.off)h+=`<div class="ln"><span>${s.cur.l[0]}</span><span>${s.cur.l[3]}: отменена</span></div>`;
	if(sub){
		h+=`<button class="hero${sub.exam?' exam':''}" data-o="${sub.k}"><span class="lb">${lab}</span><b id="t1"></b><div class="nm">${dot(sub.l)}${sub.l[3]}${chips(sub)}</div><div class="mt"><span class="tt">${sub.l[0]}–${sub.l[1]}</span> · ${mt(sub)}</div><div class="heb">${sub.l[4]} · ${sub.l[5]}</div>`;
		if(PG)h+=`<div class="pg"><i id="pg"></i></div><div class="pgl"><span>${c.l[0]}</span><span id="pgt"></span><span>${c.l[1]}</span></div>`;
		h+='</button>';
	}else{T1=null;h+='<p class="empty">Пар впереди нет.</p>'}
	// Полоска дня: пары сегодня отрезками, линия «сейчас»
	const D=s.L;
	if(D.length){
		const a0=Math.min(...D.map(x=>mi(x.l[0]))),a1=Math.max(...D.map(x=>mi(x.l[1]))),X=m=>(m-a0)/(a1-a0)*100;
		h+=`<div class="dy">${D.map(x=>`<i class="${x.off?'off':''}" style="--c:var(--${x.l[2]});left:${X(mi(x.l[0]))}%;width:calc(${X(mi(x.l[1]))-X(mi(x.l[0]))}% - 2px)"></i>`).join('')}${s.t>=a0&&s.t<=a1?`<b style="left:${X(s.t)}%"></b>`:''}</div><div class="dyl"><span>${D[0].l[0]}</span><span>сегодня</span><span>${D.at(-1).l[1]}</span></div>`;
	}
	if(then)h+=`<button class="next" data-o="${then.k}"><span class="lb">Дальше · ${whenD(then.d,n)}</span><span class="tt">${then.l[0]}<small>${then.l[1]}</small></span><span><div class="nm">${dot(then.l)}${then.l[3]}${chips(then)}</div><div class="mt">${mt(then)}</div></span></button>`;
	// Уведомления стопкой: предстоящие отмены и ближайший экзамен
	const N=[];
	for(const k of Object.keys(MK).filter(k=>MK[k]=='off').sort()){
		const[dt,hm,code]=k.split('|'),d0=new Date(dt+'T00:00'),l=W[d0.getDay()].find(l=>l[0]==hm&&l[5]==code);
		if(l&&at(d0,l[1])>n)N.push(`<div class="nf"><i>✕</i><div><span class="lb">Отмена · ${whenD(d0,n)} · ${hm}</span><div class="t">${l[3]}</div><div class="s"><span class="rm">${l[6]}</span></div></div><button class="act" data-un="${k}">Вернуть</button></div>`);
	}
	if(s.ex)N.unshift(`<div class="nf ex" data-o="${kOf(s.ex.at,s.ex.l)}"><i>!</i><div><span class="lb">Экзамен · ${whenD(s.ex.at,n)} · ${s.ex.l[0]}<em id="t3"></em></span><div class="t">${s.ex.l[3]}</div><div class="s"><span class="rm">${s.ex.l[6]}</span></div></div></div>`);
	if(N.length)h+=`<div class="nfs${NFO?' open':''}" id="nfs"><div class="nfh"><span class="lb">Уведомления · ${N.length}</span>${N.length>1?`<button id="nft">${NFO?'Свернуть':'Все'}</button>`:''}</div><div class="stk${N.length>1?' many':''}">${N.join('')}</div></div>`;
	$('v0').innerHTML=h;
}
// Вкладка «Сегодня»: шкала с часами, пары висят на ней, линия текущего времени
function today(s,n){
	const L=lessons(n),P=56;
	if(!L.length){$('v1').innerHTML='<p class="empty">Сегодня пар нет.</p>';return}
	const h0=Math.floor(Math.min(...L.map(x=>mi(x.l[0])))/60),h1=Math.ceil(Math.max(...L.map(x=>mi(x.l[1])))/60),y=m=>(m-h0*60)/60*P;
	let h=`<div class="tl" style="height:${(h1-h0)*P}px">`;
	for(let i=h0;i<=h1;i++)h+=`<div class="hr" style="top:${(i-h0)*P}px"><span>${p(i)}:00</span></div>`;
	for(const x of L){
		const same=L.filter(z=>z.l[0]==x.l[0]),j=same.indexOf(x),w=same.length;
		const pos=`top:${y(mi(x.l[0]))+2}px;height:${y(mi(x.l[1]))-y(mi(x.l[0]))-4}px${w>1?`;left:calc(48px + ${j}*(100% - 48px)/${w});width:calc((100% - 48px)/${w} - 4px)`:''}`;
		h+=`<button class="ev${cls(x)}${!x.dep&&s.t>=mi(x.l[1])?' past':''}${x.k==s.cur?.k?' cur':''}" style="${pos}"${x.dep?' tabindex="-1"':` data-o="${x.k}"`}><div class="tt">${x.l[0]}–${x.l[1]}${chips(x)}</div><div class="nm">${x.dep?'':dot(x.l)}${x.l[3]}</div><div class="mt">${x.l[6]||''}</div></button>`;
	}
	if(s.t>=h0*60&&s.t<=h1*60)h+=`<div class="now" style="top:${y(s.t)}px"></div>`;
	$('v1').innerHTML=h+'</div>';
}
// Вкладка «Неделя»: текущая, а если в ней не осталось пар, которые состоятся, то следующая; стрелкой только вперёд
let wk=0,grid=0;try{grid=+localStorage.grid||0}catch(e){}
function week(){
	const n=new Date(),t=n.getHours()*60+n.getMinutes();
	let sun=add(n,-n.getDay());
	const left=[0,1,2,3,4,5,6].some(i=>{const d=add(sun,i);return d>=add(n,0)&&real(d).some(x=>!x.off&&(ymd(d)!=ymd(n)||mi(x.l[1])>t))});
	if(!left)sun=add(sun,7);
	const base=sun;sun=add(base,wk*7);
	const D=[0,1,2,3,4].map(i=>add(sun,i)),lab=wk==0?(base>n?'Следующая неделя':'Эта неделя'):wk==1?'Ещё через неделю':`Через ${wk} нед.`;
	let h=`<div class="wk"><button id="wp" aria-label="Назад"${wk?'':' disabled'}>‹</button><div><b>${dm(D[0])} – ${dm(D[4])}</b><small>${lab}</small></div><button id="wn" aria-label="Вперёд">›</button><button class="vw" id="vw">${grid?'Список':'Таблица'}</button></div>`;
	if(grid){
		const H=42;
		h+='<div class="mx"><div></div>'+D.map((d,i)=>`<div class="hd${ymd(d)==ymd(n)?' tdy':''}"><b>${DN[i].slice(0,2)}</b>${d.getDate()}</div>`).join('');
		h+='<div class="tc">'+Array.from({length:12},(_,i)=>`<span style="top:${i*H}px">${8+i}</span>`).join('')+'</div>';
		h+=D.map(d=>{
			const L=lessons(d);
			return '<div class="col">'+L.map(x=>{
				const sh=L.some(y=>y!=x&&y.l[0]==x.l[0]),[lf,w]=!sh?[0,100]:x.dep?[78,22]:[0,76];
				return `<button class="cell${cls(x)}" style="top:${(mi(x.l[0])-480)/60*H+2}px;height:${(mi(x.l[1])-mi(x.l[0]))/60*H-4}px;left:${lf}%;width:${w}%"${x.dep?' tabindex="-1" aria-label="Часы кафедры"':` data-o="${x.k}"`}>${x.dep&&sh?'':`<span>${x.dep?'':dot(x.l)}${short(x.l)}</span>`}${x.l[6]?`<small>${x.l[6]}</small>`:''}</button>`;
			}).join('')+'</div>';
		}).join('')+'</div>';
	}else h+=D.map((d,i)=>{
		const L=lessons(d);
		return `<div class="day${ymd(d)==ymd(n)?' today':''}"><div class="dh"><b>${DN[i]}</b><span>${dm(d)}</span><i>${DHe[i]}</i></div>${L.length?`<div class="sheet">${L.map(x=>`<button class="rw${cls(x)}"${x.dep?' tabindex="-1"':` data-o="${x.k}"`}><span class="tt">${x.l[0]}<small>${x.l[1]}</small></span><span><div class="nm">${x.dep?'':dot(x.l)}${x.l[3]}${chips(x)}</div><div class="mt">${mt(x)||x.l[5]}</div></span></button>`).join('')}</div>`:'<p class="free">Свободный день</p>'}</div>`;
	}).join('');
	$('v2').innerHTML=h;
}
// Окно пары: подробности и пометки (одно на всё приложение)
let open;
function modal(){
	const m=$('md');if(!open){m.hidden=true;return}
	const d=new Date(open.split('|')[0]+'T00:00'),x=lessons(d).find(x=>x.k==open);
	m.innerHTML=`<div class="sh${cls(x)}"><small>${DN[d.getDay()]}, ${dm(d)} · ${x.l[0]}–${x.l[1]}</small><div class="nm">${dot(x.l)}${x.l[3]}${chips(x)}</div><div class="mt">${mt(x)}</div><div class="heb">${x.l[4]} · ${x.l[5]}</div><div class="bt"><button data-m="exam"${x.exam?' class="on"':''}>${x.exam?'Снять экзамен':'Экзамен'}</button><button data-m="off"${x.off?' class="on"':''}>${x.off?'Вернуть пару':'Не состоится'}</button><button class="cl">Закрыть</button></div></div>`;
	m.hidden=false;
}
$('md').onclick=e=>{
	const b=e.target.closest('button');
	if(b?.dataset.m){const m=b.dataset.m;MK[open]==m?delete MK[open]:MK[open]=m;try{localStorage.mark=JSON.stringify(MK)}catch(e){}key=null;tick();modal()}
	else if(b||!e.target.closest('.sh')){open=null;modal()}
};
// Раскрытие стопки: карточки едут из стопки на места, блок плавно меняет высоту (FLIP)
function stack(){
	const el=$('nfs'),st=el.querySelector('.stk'),cs=[...st.children],r0=cs.map(c=>c.getBoundingClientRect()),h0=st.offsetHeight;
	NFO^=1;el.classList.toggle('open',!!NFO);$('nft').textContent=NFO?'Свернуть':'Все';
	if(RM)return;
	const r1=cs.map(c=>c.getBoundingClientRect()),h1=st.offsetHeight,o={duration:460,easing:'cubic-bezier(.32,.72,0,1)'};
	st.animate([{height:h0+'px'},{height:h1+'px'}],o);
	cs.forEach((c,i)=>{const e=getComputedStyle(c).transform,t=e=='none'?'':e;c.animate([{transform:`translateY(${r0[i].top-r1[i].top}px) scale(${r0[i].width/r1[i].width}) ${t}`},{transform:t||'none'}],o)});
}
document.addEventListener('click',e=>{
	const u=e.target.closest('[data-un]');if(u){delete MK[u.dataset.un];try{localStorage.mark=JSON.stringify(MK)}catch(e){}key=null;tick();return}
	if(e.target.closest('#nft')||!NFO&&e.target.closest('.stk.many')){stack();return}
	const o=e.target.closest('[data-o]');if(o&&!o.closest('#md')){open=o.dataset.o;modal();return}
	const b=e.target.closest('#v2 button');if(!b)return;
	if(b.id=='wp'&&wk)wk--;else if(b.id=='wn')wk++;else if(b.id=='vw'){grid^=1;try{localStorage.grid=grid}catch(e){}}else return;
	week();
});
let key,S;
function tick(){
	const n=new Date(),k=[n.getDay(),n.getHours(),n.getMinutes()].join();
	$('ck').textContent=`${p(n.getHours())}:${p(n.getMinutes())}`;
	if(k!=key){key=k;S=state(n);$('dn').textContent=DN[S.d];$('dt').textContent=n.toLocaleDateString('ru-RU',{day:'numeric',month:'long'});main(S,n);today(S,n);week()}
	if(T1)$('t1').textContent=fmt(T1-n);
		if(PG){const f=Math.min(1,(n-PG[0])/(PG[1]-PG[0]));$('pg').style.transform=`scaleX(${f})`;$('pgt').textContent=`${Math.round(f*100)}%`}
	if(S.ex&&$('t3'))$('t3').textContent=fmt(S.ex.at-n);
}
// Переключение вкладок: капля на панели перетекает, содержимое уезжает влево/вправо
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches,ease='cubic-bezier(.32,.72,0,1)';
let cv=-1,px=0;
function pill(v,anim){
	const b=document.querySelector(`nav button[data-v="${v}"]`),x=b.offsetLeft,w=b.offsetWidth,pl=$('pl');
	pl.style.width=w+'px';pl.style.transform=`translateX(${x}px)`;
	if(anim&&!RM)pl.animate([{transform:`translateX(${px}px)`},{transform:`translateX(${(px+x)/2}px) scaleX(${(Math.abs(x-px)+w)/w*.75})`,offset:.45},{transform:`translateX(${x}px)`}],{duration:520,easing:'cubic-bezier(.4,1.35,.5,1)'});
	px=x;
}
function show(v){
	v=+v;if(v==cv)return;
	document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v==v));
	const o=$('v'+cv),n=$('v'+v),d=v>cv?1:-1;
	for(let i=0;i<3;i++)if(i!=v&&i!=cv)$('v'+i).hidden=true;
	pill(v,cv>=0);
	if(v==2&&wk){wk=0;week()}
	n.getAnimations().forEach(a=>a.cancel());n.style.cssText='';n.hidden=false;
	if(o&&!RM){
		const y=scrollY;
		o.style.cssText=`position:absolute;left:16px;right:16px;top:${-y}px`;scrollTo(0,0);
		o.animate([{transform:'none',opacity:1},{transform:`translateX(${-d*35}%)`,opacity:0}],{duration:380,easing:ease}).onfinish=()=>{o.style.cssText='';if(o.id!='v'+cv)o.hidden=true};
		n.animate([{transform:`translateX(${d*100}%)`},{transform:'none'}],{duration:380,easing:ease});
	}else{if(o)o.hidden=true;scrollTo(0,0)}
	cv=v;
	try{localStorage.tab=v}catch(e){}
}
addEventListener('resize',()=>pill(cv));
document.querySelector('nav').onclick=e=>{const v=e.target.closest('button')?.dataset.v;if(v)show(v)};
let v0='0';try{v0=localStorage.tab||'0'}catch(e){}
tick();show(v0);setInterval(tick,1e3);
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js',{updateViaCache:'none'});
</script>

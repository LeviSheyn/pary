/* Тёмный фон темы, светлые «бумажные» блоки; один шрифт; логические свойства, чтобы иврит (RTL) зеркалился сам */
:root{--bg:#0b2620;--on:#eef4f0;--onm:#9dbbb1;--rail:#24493f;--acc:#4fd69c;--paper:#f3efe5;--ink:#17231e;--ink2:#5f6b65;--rule:#dcd5c4;--exam:#e07f0a;--hw:#7a4fd0;--calc:#1f6f5c;--lin:#2b8a99;--disc:#7a8a2e;--eng:#8c7a4e;--gen:#6d8578;--dep:#8a958f;--own:#8fb4ff;--f:Nunito,system-ui,sans-serif;--m:Nunito,system-ui,sans-serif;--r:8px;--h:42px;color-scheme:dark}
[data-th=blue]{--bg:#0b1a2e;--on:#eef3fa;--onm:#9db2cc;--rail:#22395a;--acc:#6fb3ff}
[data-th=pink]{--bg:#2a1420;--on:#fbeff4;--onm:#cfa3b6;--rail:#4e2a3b;--acc:#ff8fb1}
[data-th=orange]{--bg:#26160b;--on:#fbf2ea;--onm:#d0ac8f;--rail:#4d3220;--acc:#ffa45c;--exam:#e5484d}
*{box-sizing:border-box}
html,*{-webkit-tap-highlight-color:rgba(0,0,0,0)!important}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--on);font:15px/1.4 var(--f);font-variant-numeric:tabular-nums;padding:calc(24px + env(safe-area-inset-top,0px)) 16px 104px;margin:0 auto;max-width:520px;transition:background .4s}
button{font:inherit;color:inherit;touch-action:manipulation}
button:active{transform:scale(.98);transition:transform .1s}
nav button:active{transform:none}
button,nav,.hero,.next,.ev,.rw,.cell{-webkit-user-select:none;user-select:none}
button:focus:not(:focus-visible){outline:none}
button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.ver{display:block;text-align:center;color:var(--rail);font-size:11px;margin-top:32px}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:16px;margin-bottom:24px}
h1{font:500 26px/1.1 var(--f);margin:0}
.top small{color:var(--onm)}
.logo{display:flex;align-items:center;gap:6px;margin-bottom:10px;font:700 12px/1 var(--f);letter-spacing:.18em;text-transform:lowercase;color:var(--onm)}
.logo svg{width:18px;height:18px;flex:none}
[dir=rtl] .logo{letter-spacing:.18em}
.tr{display:flex;align-items:center;gap:12px}
.clock{font:700 16px var(--m);color:var(--onm)}
.gear{width:36px;height:36px;border:1px solid var(--rail);border-radius:50%;background:none;color:var(--onm);cursor:pointer;display:grid;place-items:center;padding:0}
.gear svg{width:18px;height:18px}
.lb{display:block;font:600 11px var(--m);letter-spacing:.08em;text-transform:uppercase}
[dir=rtl] .lb,[dir=rtl] .mk{letter-spacing:0}
.dot{display:inline-block;width:8px;height:8px;border-radius:1px;background:var(--c);margin-inline-end:8px;vertical-align:2px;flex:none}
.mk{font:600 11px var(--m);letter-spacing:.08em;text-transform:uppercase;margin-inline-start:8px;color:var(--ink2);text-decoration:none!important;display:inline-block}
.mk.ex{color:var(--exam)}.mk.hw{color:var(--hw)}
.hero .mk{color:var(--ink2)}.hero .mk.ex{color:var(--exam)}.hero .mk.hw{color:var(--hw)}
.off .nm,.off .tt{text-decoration:line-through}
.heb{direction:rtl;font-size:13px}
/* Сейчас */
.hero{display:block;width:100%;text-align:start;background:none;border:0;padding:0;cursor:pointer}
.hero .lb{color:var(--onm)}
.tmr{display:flex;align-items:center;gap:14px;margin:10px 0 12px}
.tmr .un{align-self:flex-end;margin-bottom:6px;margin-inline-start:-4px;font:600 22px/1 var(--f);color:var(--onm)}
.hero #t1{display:block;font:700 56px/1 var(--m);letter-spacing:-.01em}
.dd{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;min-width:64px;height:64px;padding:0 10px;border:1.5px solid var(--acc);border-radius:16px;color:var(--acc)}
.dd b{font:700 30px/1 var(--m)}
.dd small{font:600 12px/1.2 var(--m);margin-top:2px}
.hero.exam .dd{border-color:var(--exam);color:var(--exam)}
.hc{background:var(--paper);color:var(--ink);border-radius:var(--r);padding:16px}
.hero .nm{font:600 22px/1.25 var(--f)}
.hero .mt{color:var(--ink2);margin-top:4px}
.hero .heb{color:var(--ink2);text-align:start;margin-top:4px}
.hc .pgh,.hc .pgl{color:var(--ink2)}
.hc .pg{background:var(--rule)}
.hero.exam #t1{color:var(--exam)}
.pgh{display:flex;justify-content:space-between;color:var(--onm);margin:16px 0 6px}
.dyh{margin-top:24px}
.pg{height:3px;background:var(--rail);overflow:hidden}
.pg i{display:block;height:100%;background:var(--acc);transform-origin:left;will-change:transform}
[dir=rtl] .pg i{transform-origin:right}
.pgl,.dyl{display:flex;justify-content:space-between;font:400 11px var(--m);color:var(--onm);margin-top:4px}
.dy{position:relative;height:28px}
.dy i{position:absolute;top:10px;height:8px;background:var(--c)}
.dy i.off{background:none;border:1px dashed var(--onm);opacity:.6}
.dy b{position:absolute;top:2px;bottom:2px;width:2px;background:var(--on)}
.ln{display:flex;gap:16px;color:var(--onm);font-size:14px;padding:8px 0;border-top:1px solid var(--rail)}
.ln span:first-child{width:48px;flex:none}
.empty{color:var(--onm);padding:24px 0}
.next{display:grid;grid-template-columns:56px 1fr;gap:4px 16px;width:100%;text-align:start;background:none;color:var(--on);border:0;border-top:1px solid var(--rail);padding:16px 0 0;margin-top:24px;cursor:pointer}
.next>.lb{grid-column:1/-1;color:var(--onm)}
.next .tt{font:400 20px/1.2 var(--m)}
.next .tt small{display:block;font-size:13px;color:var(--onm)}
.next .nm{font-weight:500;font-size:17px}
.next .mt{color:var(--onm);font-size:13px;margin-top:2px}
.next .mk{color:var(--onm)}.next .mk.ex{color:var(--exam)}.next .mk.hw{color:#c7b2ff}
/* Стопка уведомлений */
.nfs{margin-top:24px}
.nfh{display:flex;justify-content:space-between;align-items:baseline;color:var(--onm);margin-bottom:8px}
.nfh button{background:none;border:0;color:var(--acc);font:600 12px var(--m);letter-spacing:.06em;text-transform:uppercase;cursor:pointer;padding:4px 0}
.stk{display:grid;padding-bottom:20px;isolation:isolate}
.stk>.nf{grid-area:1/1}
.nfs:not(.open) .stk.many{cursor:pointer}
.stk>.nf:nth-child(1){z-index:4}
.stk>.nf:nth-child(2){transform:translateY(10px) scale(.95);z-index:3;background:color-mix(in srgb,var(--paper) 80%,var(--bg))}
.stk>.nf:nth-child(3){transform:translateY(20px) scale(.9);z-index:2;background:color-mix(in srgb,var(--paper) 60%,var(--bg))}
.stk>.nf:nth-child(n+4){transform:translateY(20px) scale(.9);z-index:1;opacity:0}
.stk>.nf:not(:first-child)>*{visibility:hidden}
.nfs.closing .stk>.nf>*{visibility:visible}
.nfs.closing .stk>.nf{background:var(--paper)}
.nfs.open .stk{gap:8px;padding-bottom:0}
.nfs.open .stk>.nf{grid-area:auto;transform:none;opacity:1;background:var(--paper)}
.nfs.open .stk>.nf>*{visibility:visible}
.nf{position:relative;display:flex;gap:12px;align-items:flex-start;background:var(--paper);color:var(--ink);border-radius:14px;padding:12px 14px;box-shadow:0 6px 20px rgba(0,0,0,.35);transform-origin:top center}
.nf>i{flex:none;width:28px;height:28px;border-radius:7px;display:grid;place-items:center;font:700 13px var(--m);font-style:normal;background:var(--rule);color:var(--ink2)}
.nf.ex>i{background:var(--exam);color:#fff}
.nf.hw>i{background:var(--hw);color:#fff}
.nf>div{flex:1;min-width:0}
.nf .lb{color:var(--ink2);display:flex;justify-content:space-between;gap:8px}
.nf .lb em{font-style:normal;font-weight:700;color:var(--exam)}
.nf.hw .lb em{color:var(--hw)}
.nf .t{font-weight:500;margin-top:2px}
.nf .s{color:var(--ink2);font-size:13px}
.nf .act{flex:none;align-self:center;background:none;border:0;color:var(--calc);font:700 12px var(--m);letter-spacing:.06em;text-transform:uppercase;padding:8px 0;padding-inline-start:8px;cursor:pointer}
/* Сегодня: шкала */
.tl{position:relative;margin-top:8px}
.tl .hr{position:absolute;inset-inline:0;border-top:1px solid var(--rail);font-size:12px;color:var(--onm)}
.tl .hr span{position:relative;top:-9px;background:var(--bg);padding-inline-end:8px;transition:background .4s}
.ev,.cell{display:flex;flex-direction:column;justify-content:flex-start}
.ev{position:absolute;inset-inline-start:48px;inset-inline-end:0;border:0;border-radius:var(--r);background:var(--paper);color:var(--ink);text-align:start;padding:8px 16px;cursor:pointer;overflow:hidden}
.ev .tt{font-size:13px;color:var(--ink2)}
.ev .nm{font-weight:500;margin-top:2px}
.ev .mt{font-size:13px;color:var(--ink2)}
.ev.past{opacity:.5}
.ev.cur{box-shadow:inset 0 0 0 2px var(--acc)}
.ev.off{background:color-mix(in srgb,var(--paper) 55%,var(--bg))}
.ev.exam{box-shadow:inset 0 0 0 2px var(--exam)}
.ev.dep,.cell.dep{background:none;border:1px dashed var(--rail);color:var(--onm);cursor:default}
.ev.dep .tt,.ev.dep .mt{color:var(--onm)}
.ev.own{background:color-mix(in srgb,var(--own) 22%,var(--paper))}
.rw.own .tt,.ev.own .tt{color:#3d63b8}
.now{position:absolute;inset-inline-start:40px;inset-inline-end:0;height:2px;background:var(--acc);z-index:1}
.now::before{content:"";position:absolute;inset-inline-start:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--acc)}
/* Неделя */
.wk{display:flex;align-items:center;gap:8px;margin-bottom:24px}
.wk div{flex:1;text-align:center}
.wk b{display:block;font-size:16px}
.wk small{color:var(--onm)}
.wk button{width:40px;height:40px;flex:none;border:1px solid var(--rail);border-radius:99px;background:none;font-size:18px;cursor:pointer}
.wk button:disabled{opacity:.3;cursor:default}
.wk .vw{width:auto;padding:0 16px;font-size:14px}
[dir=rtl] .wk #wp,[dir=rtl] .wk #wn{transform:scaleX(-1)}
.day{margin-bottom:24px}
.dh{display:flex;align-items:baseline;gap:8px;margin-bottom:8px}
.dh b{font-size:17px}
.dh span{color:var(--onm)}
.dh i{margin-inline-start:auto;font-style:normal;color:var(--onm)}
.dh .add{width:28px;height:28px;margin-inline-start:auto;border:1px solid var(--rail);border-radius:50%;background:none;color:var(--acc);font:400 18px/1 var(--f);cursor:pointer;display:grid;place-items:center;padding:0}
.dh i+.add{margin-inline-start:8px}
.today .dh b,.today .dh span{color:var(--acc)}
.sheet{background:var(--paper);color:var(--ink);border-radius:var(--r);overflow:hidden}
.rw{display:grid;grid-template-columns:48px 1fr;gap:16px;width:100%;text-align:start;background:none;border:0;border-top:1px solid var(--rule);padding:12px 16px;cursor:pointer}
.rw:first-child{border-top:0}
.rw .tt{font-weight:600}
.rw .tt small{display:block;color:var(--ink2);font-weight:400}
.rw .nm{font-weight:500}
.rw .mt{color:var(--ink2);font-size:13px}
.rw.dep{color:var(--ink2);cursor:default}
.rw.dep .nm{font-weight:400}
.rw.off{color:var(--ink2)}
.rw.exam .tt{color:var(--exam)}
.free{color:var(--onm)}
.mx{display:grid;grid-template-columns:28px repeat(5,minmax(0,1fr));gap:0 4px}
.mx .hd{text-align:center;font-size:12px;color:var(--onm);padding-bottom:8px;line-height:1.2}
.mx .hd b{display:block;font-size:14px;color:var(--on)}
.mx .hd.tdy b,.mx .hd.tdy{color:var(--acc)}
.col,.tc{position:relative;height:calc(12*var(--h))}
.col{background:repeating-linear-gradient(to bottom,var(--rail) 0 1px,transparent 1px var(--h))}
.tc span{position:absolute;inset-inline-end:4px;font-size:11px;color:var(--onm);transform:translateY(-50%)}
.cell{position:absolute;border:0;border-radius:8px;padding:4px;font-size:11px;line-height:1.2;background:var(--paper);color:var(--ink);text-align:start;overflow:hidden;overflow-wrap:anywhere;cursor:pointer}
.cell .dot{width:6px;height:6px;margin-inline-end:4px;vertical-align:1px}
.cell small{display:block;color:var(--ink2);font-size:10px}
.cell.off{background:color-mix(in srgb,var(--paper) 45%,var(--bg));text-decoration:line-through}
.cell.exam{box-shadow:inset 0 0 0 2px var(--exam)}
.cell.hasHW{box-shadow:inset 0 -3px 0 var(--hw)}
/* Сессия */
.ses{display:grid;gap:8px}
.xr{display:grid;grid-template-columns:1fr auto;gap:4px 12px;width:100%;text-align:start;background:var(--paper);color:var(--ink);border:0;border-radius:var(--r);padding:14px 16px;cursor:pointer}
.xr .nm{font-weight:600}
.xr .mt{color:var(--ink2);font-size:13px;grid-column:1}
.xr b{grid-row:1/3;grid-column:2;align-self:center;font:700 18px var(--m);color:var(--exam)}
.xr.past{opacity:.5}
.xr.past b{color:var(--ink2)}
.addx{width:100%;margin-top:16px;border:1px dashed var(--rail);border-radius:var(--r);background:none;color:var(--acc);padding:14px;font-weight:600;cursor:pointer}
/* Окно */
.md{position:fixed;inset:0;z-index:5;background:rgba(2,14,11,.78);display:flex;align-items:center;justify-content:center;padding:16px;overflow-y:auto}
.sh{width:100%;max-width:488px;background:var(--paper);color:var(--ink);border-radius:var(--r);padding:24px;margin:auto}
.sh small{color:var(--ink2)}
.sh .nm{font:500 22px/1.25 var(--f);margin:8px 0 4px}
.sh .mt{color:var(--ink2)}
.sh .heb{color:var(--ink2);margin-top:4px}
.bt{display:flex;flex-wrap:wrap;gap:8px;margin-top:24px}
.bt button{border:1px solid var(--rule);background:none;border-radius:99px;padding:8px 16px;cursor:pointer}
.bt .on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.bt .cl{margin-inline-start:auto;border:0;color:var(--ink2)}
.hws{margin-top:20px;border-top:1px solid var(--rule);padding-top:16px}
.hws .lb{color:var(--hw)}
.hwi{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule)}
.hwi input{width:20px;height:20px;margin:1px 0 0;accent-color:var(--hw);flex:none}
.hwi div{flex:1;min-width:0}
.hwi small{display:block}
.hwi.dn div,.hwi.dn small{color:#a3a39a}
.nf.hw.dn{background:color-mix(in srgb,var(--paper) 70%,#9a9a9a)}
.nf.hw.dn .t,.nf.hw.dn .lb{color:#8a8a84}
.nf.hw.dn>i{background:#b9b6ad}
.nf.hw.dn .act{color:var(--ink2)}
.hwi button{background:none;border:0;color:var(--ink2);font-size:18px;line-height:1;cursor:pointer;padding:0 4px}
.hwa{display:flex;gap:8px;margin-top:10px}
.hwm{display:flex;gap:6px;margin-top:12px}
.hwm button{border:1px solid var(--rule);background:none;border-radius:99px;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--ink2)}
.hwm button.on{background:var(--hw);border-color:var(--hw);color:#fff}
#hw-d{display:block;width:100%;margin-top:10px;padding:10px 12px;border:1px solid var(--rule);border-radius:var(--r);background:#fff;color:var(--ink);font:500 16px var(--f);color-scheme:light}
.hwa input{flex:1;min-width:0}
.fm label{display:block;color:var(--ink2);font-size:13px;margin-top:16px}
.fm input,.fm select,.hwa input{display:block;width:100%;margin-top:4px;padding:10px 12px;border:1px solid var(--rule);border-radius:var(--r);background:#fff;color:var(--ink);font:500 16px var(--f);color-scheme:light}
.fm input:focus,.fm select:focus,.hwa input:focus{outline:2px solid var(--acc);border-color:transparent}
.hwa button{flex:none;border:0;border-radius:var(--r);background:var(--hw);color:#fff;padding:0 16px;font-weight:600;cursor:pointer}
.tm2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.er{color:#b3261e;font-size:13px;margin:8px 0 0}
/* Карта */
.sh.mp{padding:16px;max-width:520px}
.mph{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.mph .nm{margin:2px 0 0}
.mph .cl{border:0;background:none;font-size:28px;line-height:1;color:var(--ink2);cursor:pointer;padding:0 4px}
.vp{position:relative;height:min(62vh,560px);overflow:hidden;border-radius:var(--r);background:#dfe7dc;touch-action:none;cursor:grab;direction:ltr}
.mi{position:absolute;left:0;top:0;width:1709px;height:2184px;transform-origin:0 0;will-change:transform}
.mi img{display:block;width:1709px;height:2184px;max-width:none;user-select:none;-webkit-user-drag:none}
.pin{position:absolute;width:0;height:0;font-style:normal}

	const Ls=lessons(n),P=56,hd=holOf(n);
	if(!Ls.length){$('v1').innerHTML=`${hd?`<p class="hol">${hd}</p>`:''}<p class="empty">${L.noToday}</p>`;return}
	const h0=Math.floor(Math.min(...Ls.map(x=>mi(x.l[0])))/60),h1=Math.ceil(Math.max(...Ls.map(x=>mi(x.l[1])))/60),y=m=>(m-h0*60)/60*P;
	let h=`${hd?`<p class="hol">${hd}</p>`:''}<div class="tl" style="height:${(h1-h0)*P}px">`;
	for(let i=h0;i<=h1;i++)h+=`<div class="hr" style="top:${(i-h0)*P}px"><span>${p(i)}:00</span></div>`;
	// окна раскладываются по колонкам вместе с парами, чтобы не налезать на часы кафедры
	const It=[...Ls,...gaps(n).map(g=>({g,l:[g.s,g.e]}))].sort((a,b)=>mi(a.l[0])-mi(b.l[0])),col=new Map,ends=[];
	for(const x of It){let j=ends.findIndex(e=>e<=mi(x.l[0]));if(j<0)j=ends.push(0)-1;ends[j]=mi(x.l[1]);col.set(x,j)}
	for(const x of It){
		const ov=It.filter(z=>mi(z.l[0])<mi(x.l[1])&&mi(x.l[0])<mi(z.l[1])),w=Math.max(...ov.map(z=>col.get(z)))+1,j=col.get(x);
		const pos=`top:${y(mi(x.l[0]))+2}px;height:${y(mi(x.l[1]))-y(mi(x.l[0]))-4}px${w>1?`;inset-inline-start:calc(48px + ${j}*(100% - 48px)/${w});width:calc((100% - 48px)/${w} - 4px)`:''}`,g=x.g;
		h+=g?`<button class="gap${g.t?' t-'+g.t:''}" style="${pos}" data-gp="${g.k}"><span class="lb">${L.win} · ${L.dur(g.b-g.a)}</span>${g.t?`<b>${L.tg[g.t]}</b>`:`<small>${L.tagIt}</small>`}</button>`:`<button class="ev${cls(x)}${!x.dep&&s.t>=mi(x.l[1])?' past':''}${x.k==s.cur?.k?' cur':''}" style="${pos}"${x.dep?' tabindex="-1"':` data-o="${x.k}"`}><div class="tt">${rg(x.l[0],x.l[1])}${chips(x)}</div><div class="nm">${x.dep?'':dot(x.l)}${nm(x.l)}</div><div class="mt">${x.l[6]||''}</div></button>`;
	}
	if(s.t>=h0*60&&s.t<=h1*60)h+=`<div class="now" style="top:${y(s.t)}px"></div>`;
	$('v1').innerHTML=h+'</div>';
}
// ---------- «Неделя»: текущая (или следующая, если в текущей всё прошло), только вперёд ----------
let wk=0,grid=ls('grid',0);
function week(){
	const n=new Date(),t=n.getHours()*60+n.getMinutes();
	let sun=add(n,-n.getDay());
	const left=[0,1,2,3,4,5,6].some(i=>{const d=add(sun,i);return d>=add(n,0)&&real(d).some(x=>!x.off&&(ymd(d)!=ymd(n)||mi(x.l[1])>t))});
	if(!left)sun=add(sun,7);
	const base=sun;sun=add(base,wk*7);
	const D=[0,1,2,3,4].map(i=>add(sun,i)),lab=wk==0?(base>n?L.wk[1]:L.wk[0]):wk==1?L.wk[2]:L.wk[3](wk+(base>n?1:0));
	let h=`<div class="wk"><button id="wp" aria-label="‹"${wk?'':' disabled'}>‹</button><div><b>${dm(D[0])} – ${dm(D[4])}</b><small>${lab}</small></div><button id="wn" aria-label="›">›</button><button class="vw" id="vw">${grid?L.list:L.table}</button></div>`;
	if(grid){
		const H=42;
		h+='<div class="mx"><div></div>'+D.map((d,i)=>`<div class="hd${ymd(d)==ymd(n)?' tdy':''}"><b>${DS[i]}</b>${d.getDate()}</div>`).join('');
		h+='<div class="tc">'+Array.from({length:12},(_,i)=>`<span style="top:${i*H}px">${8+i}</span>`).join('')+'</div>';
		h+=D.map(d=>{
			const Ls=lessons(d);
			return '<div class="col">'+Ls.map(x=>{
				const sh=Ls.some(y=>y!=x&&mi(y.l[0])<mi(x.l[1])&&mi(x.l[0])<mi(y.l[1])),[lf,w]=!sh?[0,100]:x.dep?[78,22]:x.own?[50,50]:[0,sh&&Ls.some(y=>y.own&&y!=x)?50:76];
				return `<button class="cell${cls(x)}${hwOn(x)?' hasHW':''}" style="top:${(mi(x.l[0])-480)/60*H+2}px;height:${(mi(x.l[1])-mi(x.l[0]))/60*H-4}px;inset-inline-start:${lf}%;width:${w}%"${x.dep?' tabindex="-1"':` data-o="${x.k}"`}>${x.dep&&sh?'':`<span>${x.dep?'':dot(x.l)}${short(x.l)}</span>`}${x.l[6]?`<small>${x.l[6]}</small>`:''}</button>`;
			}).join('')+'</div>';
		}).join('')+'</div>';
	}else h+=D.map((d,i)=>{
		const Ls=lessons(d),hd=holOf(d),R=[...Ls.map(x=>[mi(x.l[0]),`<button class="rw${cls(x)}"${x.dep?' tabindex="-1"':` data-o="${x.k}"`}><span class="tt">${x.l[0]}<small>${x.l[1]}</small></span><span><div class="nm">${x.dep?'':dot(x.l)}${nm(x.l)}${chips(x)}</div><div class="mt">${x.own?L.own:mt(x)||x.l[5]}</div></span></button>`]),...gaps(d).map(g=>[g.a,`<button class="rw gr${g.t?' t-'+g.t:''}" data-gp="${g.k}"><span class="tt">${g.s}<small>${g.e}</small></span><span><div class="nm">${L.win} · ${L.dur(g.b-g.a)}</div><div class="mt">${g.t?L.tg[g.t]+(g.rep?' · '+L.wkly:''):L.tagIt}</div></span></button>`])].sort((a,b)=>a[0]-b[0]);
		return `<div class="day${ymd(d)==ymd(n)?' today':''}"><div class="dh"><b>${DN[i]}</b><span>${dm(d)}</span>${ST.lang=='he'?'':`<i>${DHe[i]}</i>`}<button class="add" data-add="${ymd(d)}" aria-label="+">+</button></div>${hd?`<p class="hol">${hd}</p>`:''}${R.length?`<div class="sheet">${R.map(r=>r[1]).join('')}</div>`:hd?'':`<p class="free">${L.free}</p>`}</div>`;
	}).join('');
	$('v2').innerHTML=h;
}

const COURSES=()=>{const m=new Map;for(const D of W)for(const l of D)if(l[2]!='dep'&&!m.has(crs(l)))m.set(crs(l),nm(l).replace(/ · .*/,''));return[...m]};

function session(n){

// карточка семестра: сколько осталось, неделя, ближайший выходной
const dd=(a,n)=>Math.round((pd(a)-add(n,0))/864e5);
const wkOf=n=>{const c=AC.find(a=>a[0].length==1&&ymd(n)>=a[1]&&ymd(n)<=a[2]);return c&&Math.floor((add(n,0)-pd(c[1]))/6048e5)+1};
function semCard(n){
	const s=ymd(n),cur=AC.find(a=>s>=a[1]&&s<=a[2]),nx=AC.find(a=>a[1]>s);let h;
	if(cur){
		const N=dd(cur[2],n)+1,T=dd(cur[2],pd(cur[1]))+1;
		h=`<div class="sem"><span class="lb">${L.phs[cur[0]]}${wkOf(n)?` · ${L.wkN(wkOf(n),Math.ceil(T/7))}`:''}</span><div class="big"><b>${N}</b><small>${L.dLeft(N)}</small></div><div class="pg"><i style="transform:scaleX(${1-N/T})"></i></div><div class="pgl"><span>${dm(pd(cur[1]))}</span><span>${dm(pd(cur[2]))}</span></div>`;
		if(nx)h+=`<p class="sm">${L.phs[nx[0]]} · ${dm(pd(nx[1]))} · ${L.inD(dd(nx[1],n))}</p>`;
	}else if(nx){const k=dd(nx[1],n);h=`<div class="sem"><span class="lb">${L.phs[nx[0]]}</span><div class="big"><b>${k}</b><small>${L.dTill(k)}</small></div>`}
	else return'';
	const o=OFF.find(o=>o[1]>=s);if(o)h+=`<p class="sm">${L.nextOff}: ${tr(o[2])} · ${dm(pd(o[0]))}${o[0]>s?` · ${L.inD(dd(o[0],n))}`:''}</p>`;
	return h+'</div>';
}
// ---------- «Учёба»: оценки и ממוצע, посещаемость ----------
const NZ={'88195':6,'88132':6,'88112':6,'41004':0};
const gOf=c=>{const o={z:NZ[c]??2,g:[],e:'',...GR[c]};if(has(o.f)&&!o.g.length)o.g=[+o.f];delete o.f;return o};
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
const has=v=>v!==''&&v!=null;
// ממוצע = Σ(оценка курса × נ״ז) / Σנ״ז; оценка курса — среднее её оценок; курсы с 0 נ״ז не считаются
function avg(){
	let s=0,z=0,fs=0,fz=0,rz=0,rn=0;
	for(const[c]of COURSES()){const g=gOf(c),w=+g.z;if(!(w>0))continue;if(g.g.length){const v=mean(g.g);s+=v*w;z+=w;fs+=v*w;fz+=w}else{rz+=w;rn++;if(has(g.e)){fs+=g.e*w;fz+=w}}}
	return{v:z?s/z:null,z,f:fz>z?fs/fz:null,rz,rn,s};
}
// сколько в среднем нужно по курсам без оценок, чтобы выйти на цель
function goalT(){
	const a=avg(),T=+ls('tgt',85),e=$('g-tr');if(!e)return;
	e.textContent=!a.rz?(a.v==null?'':a.v>=T?L.gReach:L.gMiss(g1(a.v))):(()=>{const x=(T*(a.z+a.rz)-a.s)/a.rz;return x<=0?L.gReach:x>100?L.gBad(g1(x)):L.gNeed(g1(x),a.rn)})();
}
// прошедшие пары семестра; отменённые, праздники и укороченные дни сюда не попадают
function held(n){const r=new Map;for(let d=pd(AC[0][1]);d<=n&&ymd(d)<=AC[0][2];d=add(d,1))for(const x of real(d))if(!x.own&&!x.off&&at(d,x.l[0])<=n){const c=crs(x.l);if(!r.has(c))r.set(c,[]);r.get(c).push(x)}return r}
let SUB=+ls('sub',0),ABO=null;
const g1=v=>v==null?'—':String(Math.round(v*10)/10);
function study(n){
	let h=`<div class="seg"><button data-sub="0"${SUB?'':' class="on"'}>${L.grades}</button><button data-sub="1"${SUB?' class="on"':''}>${L.att}</button><i style="transform:translateX(${SUB*(ST.lang=='he'?-100:100)}%)"></i></div>`;
	if(!SUB){
		const a=avg();
		h+=`<div class="avg"><span class="lb">${L.avg}</span><div class="big"><b dir="ltr">${a.v==null?'—':g1(a.v)}</b><small>${a.v==null?L.noGr:L.byNz(a.z)}</small></div>${a.f!=null?`<p class="sm">${L.fc}: <b dir="ltr">${g1(a.f)}</b></p>`:''}<div class="goal"><label>${L.goal}<input id="g-t" type="number" inputmode="decimal" min="0" max="100" value="${ls('tgt',85)}"></label><p id="g-tr"></p></div></div><div class="ses">`;
		for(const[c,name]of COURSES()){const g=gOf(c),v=g.g.length?mean(g.g):null;h+=`<button class="xr gr" data-gr="${c}"><span class="nm">${esc(name)}</span><b dir="ltr"${v==null&&has(g.e)?' class="pv"':''}>${v!=null?g1(v):has(g.e)?g.e:'—'}</b><span class="mt">${+g.z?`${g.z} ${L.nz}`:L.noAvg}${g.g.length?` · <span dir="ltr">${g.g.join(', ')}</span>`:has(g.e)?` · ${L.exp}`:''}</span></button>`}
		h+='</div>';
	}else{
		const H=held(n);

		else{
			let T=0,M=0;for(const v of H.values()){T+=v.length;M+=v.filter(x=>AB[x.k]).length}

			for(const[c,name]of COURSES()){
				const v=H.get(c);if(!v)continue;const m=v.filter(x=>AB[x.k]).length;
				h+=`<div class="att${ABO==c?' open':''}"><button class="xr" data-abo="${c}"><span class="nm">${esc(name)}</span><b dir="ltr">${v.length-m}/${v.length}</b><span class="mt">${L.missN(m)}</span><span class="bar"><i style="transform:scaleX(${(v.length-m)/v.length})"></i></span></button>${ABO==c?`<div class="al">${v.slice().reverse().map(x=>`<button class="ar${AB[x.k]?' ms':''}" data-ab="${x.k}"><span>${DS[x.d.getDay()]}, ${dm(x.d)} · ${x.l[0]}</span><b>${AB[x.k]?L.missed:L.was}</b></button>`).join('')}</div>`:''}</div>`;
			}
			h+=`</div><p class="sm">${L.attHint}</p>`;
		}

	$('v4').innerHTML=h;goalT();

	};

function plan(N){

let pushing=0;
async function npush(){

		if(ST.pu&&ST.pt){
			const P=plan(4).filter(x=>x.at<now+255600),seen=new Set;let c=0;
			for(const x of P){seen.add(x.id);const h=x.at+'|'+x.t+'|'+x.m;if(S.s[x.id]==h)continue;if(++c>40)break;
				const r=await fetch(NT,{method:'POST',body:JSON.stringify({topic:ST.pt,sequence_id:x.id,delay:String(x.at),title:x.t,message:x.m,tags:x.g,priority:x.p,click:APP})});if(!r.ok)throw r.status;S.s[x.id]=h}

// ---------- Стопка: раскрытие и сворачивание одной анимацией (FLIP) ----------
function stack(){
	const el=$('nfs'),st=el.querySelector('.stk'),cs=[...st.children],r0=cs.map(c=>c.getBoundingClientRect()),h0=st.offsetHeight;
	NFO^=1;el.classList.toggle('open',!!NFO);$('nft').textContent=NFO?L.fold:L.all;
	if(RM)return;
	if(!NFO)el.classList.add('closing');
	const r1=cs.map(c=>c.getBoundingClientRect()),h1=st.offsetHeight,o={duration:460,easing:'cubic-bezier(.32,.72,0,1)'};
	st.animate([{height:h0+'px'},{height:h1+'px'}],o).onfinish=()=>el.classList.remove('closing');
	cs.forEach((c,i)=>{const t=getComputedStyle(c).transform,e=t=='none'?'':t,f=[{transform:`translateY(${r0[i].top-r1[i].top}px) scale(${r0[i].width/r1[i].width}) ${e}`},{transform:e||'none'}];if(!NFO&&i>2)f[1].opacity=0;c.animate(f,o)});
}

let key,S;

function tick(){
	const n=new Date(),k=[n.getDay(),n.getHours(),n.getMinutes(),ST.lang].join();
	$('ck').textContent=`${p(n.getHours())}:${p(n.getMinutes())}`;

	if(T1){
		const[d,h,m,sc]=parts(T1-n),same=ymd(T1)==ymd(n),dd=$('t1d');
		dd.hidden=!d;if(d){dd.firstChild.textContent=d;dd.lastChild.textContent=L.dw(d)}
		const e=$('t1');e.textContent=same?(h?`${h}:${p(m)}:${p(sc)}`:`${p(m)}:${p(sc)}`):`${h}:${p(m)}`;e.dir='ltr';
	}
	if(PG){const f=Math.min(1,(n-PG[0])/(PG[1]-PG[0]));$('pg').style.transform=`scaleX(${f})`;$('pgt').textContent=`${Math.round(f*100)}%`}
	S.exs.forEach((x,i)=>setT($('tx'+i),x.at-n));

}
// ---------- Вкладки: капля перетекает, содержимое уезжает влево/вправо ----------
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches,ease='cubic-bezier(.32,.72,0,1)';
let cv=-1,px=0;
function pill(v,anim){
	const b=v>2?$('hb'):document.querySelector(`nav button[data-v="${v}"]`),x=b.offsetLeft,w=b.offsetWidth,pl=$('pl');
	pl.style.width=w+'px';pl.style.transform=`translateX(${x}px)`;
	if(anim&&!RM)pl.animate([{transform:`translateX(${px}px)`},{transform:`translateX(${(px+x)/2}px) scaleX(${(Math.abs(x-px)+w)/w*.75})`,offset:.45},{transform:`translateX(${x}px)`}],{duration:520,easing:'cubic-bezier(.4,1.35,.5,1)'});
	px=x;
}
// появление: блоки вкладки поднимаются по очереди, крупные числа отсчитываются вверх
function rise(n){
	[...n.children].slice(0,8).forEach((e,j)=>e.animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:460,delay:90+j*45,easing:ease,fill:'backwards'}));
	n.querySelectorAll('.big b').forEach(b=>{const t=b.textContent,v=parseFloat(t);if(!/^\d+(\.\d)?$/.test(t))return;const d=t.includes('.')?1:0,t0=performance.now();const f=k=>{const x=Math.min(1,(k-t0)/700),e=1-Math.pow(1-x,3);b.textContent=(v*e).toFixed(d);if(x<1)requestAnimationFrame(f);else b.textContent=t};requestAnimationFrame(f)});
}
function show(v){
	v=+v;if(v==cv)return;
	document.querySelectorAll('nav button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v==v));$('hb').classList.toggle('on',v>2);menu(0);
	const o=$('v'+cv),n=$('v'+v),d=(v>cv?1:-1)*(ST.lang=='he'?-1:1);
	for(let i=0;i<5;i++)if(i!=v&&i!=cv)$('v'+i).hidden=true;
	pill(v,cv>=0);
	if(v==2&&wk){wk=0;week()}
	n.getAnimations().forEach(a=>a.cancel());n.style.cssText='';n.hidden=false;
	if(o&&!RM){
		const y=scrollY;
		o.style.cssText=`position:absolute;left:16px;right:16px;top:${-y}px`;scrollTo(0,0);
		o.animate([{transform:'none',opacity:1},{transform:`translateX(${-d*35}%)`,opacity:0}],{duration:380,easing:ease}).onfinish=()=>{o.style.cssText='';if(o.id!='v'+cv)o.hidden=true};
		n.animate([{transform:`translateX(${d*100}%)`},{transform:'none'}],{duration:380,easing:ease});
		rise(n);
	}else{if(o)o.hidden=true;scrollTo(0,0)}
	cv=v;put('tab',v);
}
